[project]
name = "accheck"
version = "0.1.0.dev0"
description = "Check that a ticket's acceptance criteria are testable and covered by autotests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
